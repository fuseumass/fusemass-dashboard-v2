name: CI

on:
  pull_request:

jobs:
  frontend:
    name: frontend (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # Fail on known high/critical vulnerabilities in what ships (B30).
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  # T15: nothing secret and no data exports in the repo. The old judging repo
  # shipped judge passwords and participant emails in committed CSVs (B16).
  secrets:
    name: secrets + exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Exports (attendee lists, applications, ...) belong outside the repo.
      # The only CSV that may be committed is reference data in backend/data/.
      - name: No CSV files outside backend/data/
        run: |
          csvs=$(git ls-files -- '*.csv' ':!backend/data/')
          if [ -n "$csvs" ]; then
            echo "::error::CSV files must not be committed outside backend/data/:"
            echo "$csvs"
            exit 1
          fi
      # gitleaks, pinned and checked against the checksum its release page
      # publishes (the maintained GitHub Action needs a paid license for
      # organisation repos). Scans the commits this PR adds. If it flags a
      # false positive, allowlist it in a .gitleaks.toml rather than
      # switching the job off.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan this PR's commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  backend:
    name: backend (node --check + tests)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Fail on known high/critical vulnerabilities in what ships (B30).
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      # No type-checking in this repo (plain, dynamically-typed JS — see
      # README.md §3): node --check is the syntax gate, run over every
      # backend .js file outside node_modules.
      - name: node --check
        working-directory: backend
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      # test/helpers/testEnv.js defaults MONGODB_URI to the local Mongo
      # service above (127.0.0.1:27017) when it isn't already set, so no
      # extra env wiring is needed here.
      - run: npm test
        working-directory: backend
